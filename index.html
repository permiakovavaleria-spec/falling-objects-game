<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Лови падающие объекты</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151c;
      --panel: rgba(250, 250, 250, 0.1);
      --panel-strong: rgba(250, 250, 250, 0.18);
      --text: #f8fafc;
      --muted: #b8c0cc;
      --accent: #18c78f;
      --danger: #ff5a72;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    body {
      min-height: 100svh;
    }

    .game {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(circle at 20% 16%, rgba(24, 199, 143, 0.28), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(255, 209, 102, 0.18), transparent 26%),
        linear-gradient(180deg, #141a24 0%, #0e1218 100%);
    }

    header {
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: max(14px, env(safe-area-inset-top)) 14px 10px;
    }

    .metric,
    .tool {
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(14px);
    }

    .metric {
      display: grid;
      place-items: center;
      padding: 7px 8px;
      text-align: center;
    }

    .metric span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .metric strong {
      margin-top: 3px;
      font-size: 24px;
      line-height: 1;
    }

    .stage {
      position: relative;
      min-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 116px;
      width: min(88vw, 380px);
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.72);
      font-size: 15px;
      line-height: 1.35;
      text-align: center;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    footer {
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr 56px;
      gap: 10px;
      padding: 10px 14px max(14px, env(safe-area-inset-bottom));
    }

    .tool {
      position: relative;
      display: grid;
      place-items: center;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .photo-tool input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .photo-label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 700;
    }

    .photo-label svg,
    .icon-button svg {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }

    .photo-label span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      padding: 0;
    }

    .tool.is-off {
      color: var(--muted);
      opacity: 0.68;
    }

    .pause-menu {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      transform: translate(-50%, -50%);
      width: min(86vw, 320px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(17, 21, 28, 0.82);
      padding: 16px;
      color: var(--text);
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
    }

    .pause-menu h2 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1;
    }

    .pause-actions {
      display: grid;
      gap: 10px;
    }

    .pause-action {
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(5, 8, 12, 0.72);
      backdrop-filter: blur(10px);
    }

    .overlay[hidden] {
      display: none;
    }

    .dialog {
      width: min(92vw, 380px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: rgba(18, 24, 32, 0.95);
      padding: 22px;
      text-align: center;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.36);
    }

    .dialog h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.05;
    }

    .dialog p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
    }

    .primary {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #07110e;
      font: inherit;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .game::after {
        content: "Поверни телефон вертикально";
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #10151d;
        color: var(--text);
        font-size: 24px;
        font-weight: 800;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Игра Лови падающие объекты">
    <header>
      <div class="metric">
        <span>Очки</span>
        <strong id="score">0</strong>
      </div>
      <div class="metric">
        <span>Жизни</span>
        <strong id="lives">3</strong>
      </div>
      <div class="metric">
        <span>Скорость</span>
        <strong id="speed">1.0</strong>
      </div>
      <div class="metric">
        <span>Рекорд</span>
        <strong id="record">0</strong>
      </div>
    </header>

    <section class="stage" id="stage">
      <canvas id="gameCanvas" aria-label="Игровое поле"></canvas>
      <p class="hint" id="hint">Веди корзину пальцем. Поймай как можно больше падающих объектов.</p>
      <div class="pause-menu" id="pauseMenu" hidden>
        <h2>Пауза</h2>
        <div class="pause-actions">
          <button class="pause-action" id="musicBtn" type="button" aria-pressed="true">Убрать музыку</button>
          <button class="pause-action" id="catchSoundBtn" type="button" aria-pressed="true">Убрать звук ловли</button>
          <button class="pause-action" id="restartBtn" type="button">Начать сначала</button>
        </div>
      </div>
    </section>

    <footer>
      <label class="tool photo-tool" title="Выбрать фото для корзины">
        <input id="photoInput" type="file" accept="image/*">
        <span class="photo-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path>
            <circle cx="12" cy="13" r="3.5"></circle>
          </svg>
          <span id="photoText">Фото корзины</span>
        </span>
      </label>
      <button class="tool icon-button" id="pauseBtn" type="button" title="Пауза" aria-label="Пауза" aria-pressed="false">
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5v14"></path>
          <path d="M15 5v14"></path>
        </svg>
        <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="m8 5 11 7-11 7V5Z"></path>
        </svg>
      </button>
    </footer>
  </main>

  <audio id="appleSound" src="assets/apple-bite.mp3" preload="auto"></audio>
  <audio id="bombSound" src="assets/bomb-detonation.mp3" preload="auto"></audio>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <h1 id="overlayTitle">Готов?</h1>
      <p id="overlayText">Лови падающие фишки, двигай корзину пальцем и попробуй удержаться, когда скорость вырастет.</p>
      <button class="primary" id="startBtn" type="button">Старт</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const speedEl = document.getElementById("speed");
    const recordEl = document.getElementById("record");
    const hintEl = document.getElementById("hint");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const musicBtn = document.getElementById("musicBtn");
    const catchSoundBtn = document.getElementById("catchSoundBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const pauseIcon = document.getElementById("pauseIcon");
    const playIcon = document.getElementById("playIcon");
    const pauseMenu = document.getElementById("pauseMenu");
    const photoInput = document.getElementById("photoInput");
    const photoText = document.getElementById("photoText");
    const appleSound = document.getElementById("appleSound");
    const bombSound = document.getElementById("bombSound");
    const recordStorageKey = "fallingObjectsRecord";

    function loadRecord() {
      try {
        return Number(localStorage.getItem(recordStorageKey) || 0);
      } catch (error) {
        return 0;
      }
    }

    const state = {
      width: 0,
      height: 0,
      pixelRatio: 1,
      score: 0,
      record: loadRecord(),
      lives: 3,
      running: false,
      paused: false,
      gameOver: false,
      lastTime: 0,
      spawnTimer: 0,
      elapsed: 0,
      basket: { x: 0, y: 0, width: 96, height: 72 },
      objects: [],
      lifeLossScores: [],
      avatar: null,
      flash: 0,
      audio: null,
      audioPrimed: false,
      mediaPrimed: false,
      musicEnabled: true,
      catchSoundEnabled: true,
      musicTimer: null,
      musicStep: 0
    };

    const colors = ["#18c78f", "#ffd166", "#59a6ff", "#ff5a72", "#f7f7fb"];
    const musicNotes = [262, 330, 392, 523, 440, 392, 330, 294, 330, 392, 494, 392, 349, 330, 294, 262];

    function resize() {
      const rect = stage.getBoundingClientRect();
      state.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      state.width = Math.floor(rect.width);
      state.height = Math.floor(rect.height);
      canvas.width = Math.floor(state.width * state.pixelRatio);
      canvas.height = Math.floor(state.height * state.pixelRatio);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);

      state.basket.width = Math.max(84, Math.min(124, state.width * 0.26));
      state.basket.height = state.basket.width * 0.74;
      state.basket.y = state.height - state.basket.height - 18;
      state.basket.x = clamp(state.basket.x || state.width / 2, state.basket.width / 2, state.width - state.basket.width / 2);
      draw();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function reset() {
      state.score = 0;
      state.lives = 3;
      state.elapsed = 0;
      state.spawnTimer = 0;
      state.objects = [];
      state.lifeLossScores = [];
      state.gameOver = false;
      state.paused = false;
      state.flash = 0;
      state.basket.x = state.width / 2;
      updatePauseUi();
      updateHud();
      hintEl.classList.remove("hidden");
    }

    function start() {
      unlockAudio();
      reset();
      state.running = true;
      state.lastTime = performance.now();
      overlay.hidden = true;
      startMusic();
      requestAnimationFrame(loop);
    }

    function endGame(reason = "miss") {
      state.running = false;
      state.paused = false;
      state.gameOver = true;
      stopMusic();
      updatePauseUi();
      overlayTitle.textContent = "Game Over";
      overlayText.textContent = reason === "bomb"
        ? `Поймал бомбу. Твой счет: ${state.score}. Нажми рестарт и попробуй еще раз.`
        : `Твой счет: ${state.score}. Нажми рестарт и попробуй еще раз.`;
      startBtn.textContent = "Рестарт";
      overlay.hidden = false;
    }

    function difficulty() {
      return 1 + state.elapsed / 48000;
    }

    function spawnObject() {
      const d = difficulty();
      const radius = 18 + Math.random() * 12;
      const isBomb = state.score >= 10 && Math.random() < Math.min(0.34, 0.16 + (state.score - 10) * 0.012);
      state.objects.push({
        x: 22 + Math.random() * (state.width - 44),
        y: -radius,
        radius,
        speed: 140 + Math.random() * 90 + d * 42 + (isBomb ? 18 : 0),
        color: isBomb ? "#050505" : colors[Math.floor(Math.random() * colors.length)],
        type: isBomb ? "bomb" : "bonus",
        spin: Math.random() * Math.PI,
        wobble: Math.random() * 2 - 1
      });
    }

    function update(dt) {
      const d = difficulty();
      state.elapsed += dt * 1000;
      state.spawnTimer -= dt * 1000;
      state.flash = Math.max(0, state.flash - dt * 3);

      if (state.spawnTimer <= 0) {
        spawnObject();
        state.spawnTimer = Math.max(310, 920 - d * 130);
      }

      for (let i = state.objects.length - 1; i >= 0; i -= 1) {
        const object = state.objects[i];
        object.y += object.speed * dt;
        object.x += Math.sin(state.elapsed / 280 + object.spin) * object.wobble * 0.7;

        const basketTop = state.basket.y + 10;
        const inBasketX = object.x > state.basket.x - state.basket.width / 2 && object.x < state.basket.x + state.basket.width / 2;
        const inBasketY = object.y + object.radius > basketTop && object.y < state.basket.y + state.basket.height;

        if (inBasketX && inBasketY) {
          state.objects.splice(i, 1);
          if (object.type === "bomb") {
            playBombSound();
            updateHud();
            endGame("bomb");
            break;
          }
          state.score += 1;
          updateRecord();
          awardLifeRecovery();
          state.flash = 1;
          playCatchSound();
          hintEl.classList.add("hidden");
          updateHud();
          continue;
        }

        if (object.y - object.radius > state.height) {
          state.objects.splice(i, 1);
          if (object.type === "bomb") {
            continue;
          }
          state.lives -= 1;
          state.lifeLossScores.push(state.score);
          playMissSound();
          updateHud();
          if (state.lives <= 0) {
            endGame();
            break;
          }
        }
      }
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      speedEl.textContent = difficulty().toFixed(1);
      recordEl.textContent = state.record;
    }

    function updateRecord() {
      if (state.score <= state.record) return;
      state.record = state.score;
      try {
        localStorage.setItem(recordStorageKey, String(state.record));
      } catch (error) {
        // Some mobile private modes block storage; the live session record still works.
      }
    }

    function awardLifeRecovery() {
      while (state.lifeLossScores.length > 0 && state.lives < 3 && state.score >= state.lifeLossScores[0] + 30) {
        state.lifeLossScores.shift();
        state.lives += 1;
      }
    }

    function unlockAudio() {
      if (!state.audio) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        state.audio = new AudioContext();
      }

      if (state.audio.state === "suspended") {
        state.audio.resume().then(primeAudio).catch(() => {});
      } else {
        primeAudio();
      }

      primeMediaAudio();
    }

    function playTone(frequency, startTime, duration, type, volume) {
      if (!state.audio) return;
      const oscillator = state.audio.createOscillator();
      const gain = state.audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, startTime);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      oscillator.connect(gain);
      gain.connect(state.audio.destination);
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.03);
    }

    function primeAudio() {
      if (!state.audio || state.audioPrimed) return;
      state.audioPrimed = true;
      const now = state.audio.currentTime;
      const oscillator = state.audio.createOscillator();
      const gain = state.audio.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.0001, now);
      oscillator.connect(gain);
      gain.connect(state.audio.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.04);
    }

    function primeMediaAudio() {
      if (state.mediaPrimed) return;
      state.mediaPrimed = true;
      [appleSound, bombSound].forEach((sound) => {
        sound.load();
        sound.volume = 1;
        sound.muted = true;
        const playPromise = sound.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              sound.pause();
              sound.currentTime = 0;
              sound.muted = false;
            })
            .catch(() => {
              sound.muted = false;
            });
        } else {
          sound.muted = false;
        }
      });
    }

    function playMediaSound(sound, fallback) {
      sound.pause();
      sound.currentTime = 0;
      const playPromise = sound.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(fallback);
      }
    }

    function playCatchSound() {
      if (!state.catchSoundEnabled) return;
      unlockAudio();
      playMediaSound(appleSound, () => {
        if (!state.audio) return;
        playGeneratedAppleCrunch();
      });
    }

    function playGeneratedAppleCrunch() {
      if (!state.audio) return;
      const now = state.audio.currentTime;
      playTone(165, now, 0.035, "triangle", 0.1);
      playTone(330, now + 0.018, 0.025, "square", 0.055);
      playAppleCrunch(now + 0.004);
    }

    function playAppleCrunch(startTime) {
      if (!state.audio) return;
      const duration = 0.14;
      const sampleRate = state.audio.sampleRate;
      const buffer = state.audio.createBuffer(1, Math.floor(sampleRate * duration), sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) {
        const t = i / data.length;
        const attack = Math.min(1, t / 0.08);
        const decay = Math.pow(1 - t, 2.2);
        const snap = Math.random() > 0.42 ? 1 : -1;
        const grain = Math.sin(i * 0.62) * 0.28 + snap * (0.45 + Math.random() * 0.55);
        data[i] = grain * attack * decay;
      }

      const source = state.audio.createBufferSource();
      const crunchFilter = state.audio.createBiquadFilter();
      const bodyFilter = state.audio.createBiquadFilter();
      const gain = state.audio.createGain();
      source.buffer = buffer;
      crunchFilter.type = "bandpass";
      crunchFilter.frequency.setValueAtTime(1850, startTime);
      crunchFilter.frequency.exponentialRampToValueAtTime(980, startTime + duration);
      crunchFilter.Q.setValueAtTime(3.2, startTime);
      bodyFilter.type = "lowpass";
      bodyFilter.frequency.setValueAtTime(2400, startTime);
      bodyFilter.Q.setValueAtTime(0.8, startTime);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.16, startTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.075, startTime + 0.055);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      source.connect(crunchFilter);
      crunchFilter.connect(bodyFilter);
      bodyFilter.connect(gain);
      gain.connect(state.audio.destination);
      source.start(startTime);
      source.stop(startTime + duration);
    }

    function playMissSound() {
      unlockAudio();
      if (!state.audio) return;
      const now = state.audio.currentTime;
      const oscillator = state.audio.createOscillator();
      const gain = state.audio.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(196, now);
      oscillator.frequency.exponentialRampToValueAtTime(98, now + 0.36);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      oscillator.connect(gain);
      gain.connect(state.audio.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.45);
    }

    function playBombSound() {
      unlockAudio();
      playMediaSound(bombSound, playGeneratedBombSound);
    }

    function playGeneratedBombSound() {
      if (!state.audio) return;
      const now = state.audio.currentTime;
      const oscillator = state.audio.createOscillator();
      const gain = state.audio.createGain();
      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(140, now);
      oscillator.frequency.exponentialRampToValueAtTime(46, now + 0.48);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.09, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.52);
      oscillator.connect(gain);
      gain.connect(state.audio.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.56);
    }

    function startMusic() {
      unlockAudio();
      stopMusic();
      if (!state.audio || !state.musicEnabled || !state.running || state.paused) return;
      scheduleMusicNote();
    }

    function stopMusic() {
      if (state.musicTimer) {
        clearTimeout(state.musicTimer);
        state.musicTimer = null;
      }
    }

    function scheduleMusicNote() {
      if (!state.audio || !state.musicEnabled || !state.running || state.paused) return;
      const now = state.audio.currentTime;
      const note = musicNotes[state.musicStep % musicNotes.length];
      playTone(note, now, 0.09, "square", 0.018);
      playTone(note / 2, now, 0.11, "triangle", 0.012);
      state.musicStep += 1;
      state.musicTimer = setTimeout(scheduleMusicNote, state.musicStep % 4 === 0 ? 250 : 185);
    }

    function toggleMusic() {
      state.musicEnabled = !state.musicEnabled;
      if (state.musicEnabled && state.running && !state.paused) {
        startMusic();
      } else {
        stopMusic();
      }
      updatePauseMenuUi();
    }

    function toggleCatchSound() {
      state.catchSoundEnabled = !state.catchSoundEnabled;
      updatePauseMenuUi();
    }

    function togglePause() {
      if (!state.running || state.gameOver) return;
      state.paused = !state.paused;
      if (state.paused) {
        stopMusic();
      } else {
        state.lastTime = performance.now();
        startMusic();
      }
      updatePauseUi();
    }

    function updatePauseUi() {
      pauseMenu.hidden = !state.paused;
      pauseIcon.hidden = state.paused;
      playIcon.hidden = !state.paused;
      pauseBtn.classList.toggle("is-off", !state.running);
      pauseBtn.setAttribute("aria-pressed", String(state.paused));
      pauseBtn.setAttribute("aria-label", state.paused ? "Продолжить" : "Пауза");
      pauseBtn.setAttribute("title", state.paused ? "Продолжить" : "Пауза");
      updatePauseMenuUi();
    }

    function updatePauseMenuUi() {
      musicBtn.textContent = state.musicEnabled ? "Убрать музыку" : "Включить музыку";
      musicBtn.setAttribute("aria-pressed", String(state.musicEnabled));
      catchSoundBtn.textContent = state.catchSoundEnabled ? "Убрать звук ловли" : "Включить звук ловли";
      catchSoundBtn.setAttribute("aria-pressed", String(state.catchSoundEnabled));
    }

    function drawBackground() {
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.save();
      ctx.globalAlpha = 0.24;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      const step = 42;
      for (let y = 16; y < state.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(state.width, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawObject(object) {
      if (object.type === "bomb") {
        drawBomb(object);
        return;
      }

      ctx.save();
      ctx.translate(object.x, object.y);
      ctx.rotate(object.spin + state.elapsed / 700);
      ctx.fillStyle = object.color;
      ctx.beginPath();
      for (let i = 0; i < 8; i += 1) {
        const angle = (Math.PI * 2 * i) / 8;
        const radius = i % 2 === 0 ? object.radius : object.radius * 0.72;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
      ctx.beginPath();
      ctx.arc(0, 0, object.radius * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBomb(object) {
      ctx.save();
      ctx.translate(object.x, object.y);
      ctx.rotate(Math.sin(state.elapsed / 260 + object.spin) * 0.22);
      ctx.fillStyle = "#050505";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 4, object.radius * 0.92, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#222832";
      roundedRect(-object.radius * 0.26, -object.radius * 0.96, object.radius * 0.52, object.radius * 0.32, 4);
      ctx.fill();

      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -object.radius * 0.98);
      ctx.quadraticCurveTo(object.radius * 0.62, -object.radius * 1.4, object.radius * 0.92, -object.radius * 1.05);
      ctx.stroke();

      ctx.fillStyle = "#ff5a72";
      ctx.beginPath();
      ctx.arc(object.radius * 0.94, -object.radius * 1.04, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
      ctx.beginPath();
      ctx.arc(-object.radius * 0.28, -object.radius * 0.18, object.radius * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBasket() {
      const b = state.basket;
      const left = b.x - b.width / 2;
      const top = b.y;
      const radius = 14;

      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;
      ctx.fillStyle = "#f3f7fb";
      roundedRect(left, top + 18, b.width, b.height - 18, radius);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#18c78f";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(b.x, top + 25, b.width * 0.36, Math.PI, Math.PI * 2);
      ctx.stroke();

      if (state.avatar) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, top + b.height * 0.55, b.height * 0.28, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(state.avatar, b.x - b.height * 0.28, top + b.height * 0.27, b.height * 0.56, b.height * 0.56);
        ctx.restore();
      } else {
        ctx.fillStyle = "#11151c";
        ctx.beginPath();
        ctx.arc(b.x - 15, top + b.height * 0.54, 5, 0, Math.PI * 2);
        ctx.arc(b.x + 15, top + b.height * 0.54, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#11151c";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(b.x, top + b.height * 0.58, 20, 0.15, Math.PI - 0.15);
        ctx.stroke();
      }

      if (state.flash > 0) {
        ctx.globalAlpha = state.flash;
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 4;
        roundedRect(left - 6, top + 12, b.width + 12, b.height - 6, 18);
        ctx.stroke();
      }

      ctx.restore();
    }

    function roundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
    }

    function draw() {
      drawBackground();
      state.objects.forEach(drawObject);
      drawBasket();
    }

    function loop(time) {
      if (!state.running) return;
      if (state.paused) {
        state.lastTime = time;
        draw();
        requestAnimationFrame(loop);
        return;
      }
      const dt = Math.min((time - state.lastTime) / 1000, 0.032);
      state.lastTime = time;
      update(dt);
      draw();
      if (state.running) requestAnimationFrame(loop);
    }

    function moveBasket(clientX) {
      if (state.paused) return;
      const rect = canvas.getBoundingClientRect();
      state.basket.x = clamp(clientX - rect.left, state.basket.width / 2, state.width - state.basket.width / 2);
      if (!state.running) draw();
    }

    stage.addEventListener("pointerdown", (event) => {
      if (state.paused) return;
      moveBasket(event.clientX);
      stage.setPointerCapture(event.pointerId);
    });

    stage.addEventListener("pointermove", (event) => {
      if (state.paused) return;
      moveBasket(event.clientX);
    });

    stage.addEventListener("pointerup", (event) => {
      if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      const image = new Image();
      image.onload = () => {
        state.avatar = image;
        photoText.textContent = "Фото выбрано";
        draw();
      };
      image.src = URL.createObjectURL(file);
    });

    startBtn.addEventListener("pointerdown", unlockAudio);
    restartBtn.addEventListener("pointerdown", unlockAudio);
    document.addEventListener("touchstart", unlockAudio, { passive: true, once: true });
    startBtn.addEventListener("click", start);
    restartBtn.addEventListener("click", start);
    musicBtn.addEventListener("click", toggleMusic);
    catchSoundBtn.addEventListener("click", toggleCatchSound);
    pauseBtn.addEventListener("click", togglePause);
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    resize();
    updatePauseUi();
    updateHud();
    draw();
  </script>
</body>
</html>
